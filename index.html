<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo API TheSportsDB - World Cup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-950 border-b border-slate-800 py-6 text-center">
        <h1 class="text-2xl font-bold text-emerald-400">DEMO KẾT NỐI API THỰC</h1>
        <p class="text-xs text-slate-400 mt-1">Nguồn dữ liệu: thesportsdb.com (API Key: 1)</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <div class="flex justify-center mb-8">
            <button onclick="loadMatchData()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-6 rounded-lg shadow-md transition cursor-pointer">
                🔄 Tải/Làm mới dữ liệu từ API
            </button>
        </div>

        <section>
            <h2 class="text-lg font-semibold text-slate-300 mb-4 border-l-4 border-emerald-500 pl-2">
                Kết quả các trận đấu gần đây (Dữ liệu thật JSON)
            </h2>
            
            <div id="match-container" class="space-y-4">
                <div class="text-center text-slate-500 py-8 italic border border-dashed border-slate-700 rounded-xl">
                    Nhấn nút phía trên để bắt đầu gọi API thực tế...
                </div>
            </div>
        </section>

    </main>

    <script>
        // Hàm gọi API từ TheSportsDB
        async function loadMatchData() {
            const container = document.getElementById('match-container');
            container.innerHTML = `<div class="text-center text-slate-400 py-8 animate-pulse">🔄 Đang kết nối tới server TheSportsDB...</div>`;

            // Sử dụng API Key '1' (Free công khai)
            // Lấy danh sách các trận đấu gần nhất của đội tuyển Mỹ (Team ID: 134911) làm ví dụ demo dữ liệu thực tế
            const apiKey = "1";
            const teamId = "134911"; 
            const url = `https://www.thesportsdb.com/api/v1/json/${apiKey}/resultsnext.php?id=${teamId}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                // Kiểm tra xem API có trả về mảng trận đấu hay không
                if (!data.results || data.results.length === 0) {
                    container.innerHTML = `
                        <div class="bg-yellow-950/30 border border-yellow-800 text-yellow-400 p-4 rounded-xl text-center">
                            Không tìm thấy trận đấu nào sắp tới hoặc API Key công cộng đang bận. Vui lòng thử lại sau!
                        </div>`;
                    return;
                }

                // Xóa trạng thái loading và chuẩn bị render dữ liệu câu lạc bộ
                container.innerHTML = "";

                // Duyệt qua danh sách trận đấu trả về từ API (Mặc định trả về tối đa 5 trận)
                data.results.forEach(match => {
                    // Định dạng lại thời gian hiển thị cơ bản
                    const matchDate = match.dateEvent || "Chưa rõ ngày";
                    const matchTime = match.strTime ? match.strTime.substring(0, 5) : "00:00";
                    
                    // Tạo component HTML động cho từng trận đấu
                    const matchCard = document.createElement('div');
                    matchCard.className = "bg-slate-800 border border-slate-700/60 rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between shadow-lg hover:border-slate-600 transition";
                    
                    matchCard.innerHTML = `
                        <div class="text-center sm:text-left mb-3 sm:mb-0">
                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 bg-slate-900 rounded text-amber-400 border border-slate-700">
                                ${match.strLeague}
                            </span>
                            <p class="text-xs text-slate-400 mt-2 font-mono">📅 Ngày: ${matchDate} | ⏰ Giờ: ${matchTime} GMT</p>
                        </div>

                        <div class="flex items-center justify-center space-x-4 w-full sm:w-3/5">
                            <div class="w-2/5 text-right font-bold text-sm text-slate-100 truncate">
                                ${match.strHomeTeam}
                            </div>
                            
                            <div class="px-3 py-1 bg-slate-950 rounded-lg font-mono font-bold text-emerald-400 border border-slate-800 min-w-[50px] text-center">
                                ${match.intHomeScore !== null && match.intAwayScore !== null 
                                    ? `${match.intHomeScore} - ${match.intAwayScore}` 
                                    : "VS"}
                            </div>
                            
                            <div class="w-2/5 text-left font-bold text-sm text-slate-100 truncate">
                                ${match.strAwayTeam}
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(matchCard);
                });

            } catch (error) {
                console.error("Lỗi API:", error);
                container.innerHTML = `
                    <div class="bg-red-950/30 border border-red-800 text-red-400 p-4 rounded-xl text-center">
                        ❌ Lỗi kết nối không thể lấy dữ liệu từ API. Vui lòng kiểm tra lại mạng Internet hoặc API Endpoint!
                    </div>`;
            }
        }
    </script>
</body>
</html>
