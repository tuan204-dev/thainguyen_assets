    <script type="text/javascript">
        $(".js-btn-menu").click(function (e) {
            e.preventDefault();
            $(".js-bool-list").toggleClass("active");
        });
        let printversion_params = () => ({ type: 'new', printversionId: $('.book:last').attr('pid')  });
        function loadDataPrint(apiUrl, type) {
            $.ajax({
                url: apiUrl,
                type: "get",
                success: function (data) {
                    if (type == "time") {
                        $('.books').html('');
                        $('.onecms__loadmore').hide();
                        if (data.length == 0) {
                            $('.books:first').append(`<span>Không tìm thấy kết quả</span>`);
                            return false;
                        }
                    }
                    if (data.length == 0) {
                        return false;
                    }
                    $.each(data, function (idx, item) {
                        let html = `<a class="book" href="${item.LinkToMe}" pid="${item.PrintVersionId}">
                                    <img alt = "${item.Title}"  title = "${item.Title}"  src ="${item.Thumbnail_480x697}" />
                                    </a>`;
                        $('.books:first').append(html);
                    });
                    if (type == "time") {
                        $('.onecms__loadmore').hide();
                    }
                    else {
                        $('.onecms__loadmore').show();
                    }
                }
            })
        }
        $(window).ready(function () {
            $.datetimepicker.setLocale('vi');
            $('.date-picker').datetimepicker({
                format: 'd-m-Y',
                lang: 'vi',
                time: false,
                timepicker: false,
            })
            $('.date-picker').change(function () {
                const dateA = $('#txtDate').val();
                if (dateA === "") return false;
                const url = `/api/getmoreprintversion/${dateA}`;
                loadDataPrint(url, "time");
            });

            $('.onecms__loadmore').click(function () {
                $('.onecms__loadmore').hide();
                if (printversion_params().printversionId === undefined)
                    return false;
                const url = `/api/getmoreprintversion/${printversion_params().type}_${printversion_params().printversionId}`;
                loadDataPrint(url);
            })

        });


    </script>
