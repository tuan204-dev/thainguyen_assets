        <portlet name="truyen_hinh_footer" />

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const desktopItems = document.querySelectorAll("#desktopNav a");
                const mobileItems = document.querySelectorAll("#mobileNav a");
                const desktopIndicator = document.getElementById("desktopIndicator");
                const mobileIndicator = document.getElementById("mobileIndicator");

                const positionDesktopIndicator = (index) => {
                    if (desktopItems[index] && desktopIndicator) {
                        const item = desktopItems[index];
                        desktopIndicator.style.width = item.offsetWidth + "px";
                        desktopIndicator.style.transform = `translateX(${item.offsetLeft}px)`;
                    }
                };

                positionDesktopIndicator(0);

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => positionDesktopIndicator(getActiveIndex()));
                }

                const imgActive =
                    "t:w-6 t:h-6 t:object-contain t:brightness-0 t:invert t:transition-all t:duration-300";
                const imgInactive = "t:w-6 t:h-6 t:object-contain t:transition-all t:duration-300";

                const getActiveIndex = () => {
                    let activeIndex = 0;
                    mobileItems.forEach((el, i) => {
                        if (el.classList.contains("t:text-white")) activeIndex = i;
                    });
                    return activeIndex;
                };

                const updateNav = (index) => {
                    positionDesktopIndicator(index);

                    if (mobileIndicator) {
                        mobileIndicator.style.transform = `translateX(${index * 100}%)`;
                    }

                    mobileItems.forEach((el, i) => {
                        if (i === index) {
                            el.classList.add("t:text-white");
                            el.classList.remove("t:text-[#8F9BB3]");
                        } else {
                            el.classList.add("t:text-[#8F9BB3]");
                            el.classList.remove("t:text-white");
                        }
                        const img = el.querySelector("img");
                        if (img) {
                            img.className = i === index ? imgActive : imgInactive;
                        }
                    });
                };

                desktopItems.forEach((item, i) => {
                    item.addEventListener("click", (e) => {
                        e.preventDefault();
                        updateNav(i);
                    });
                });

                mobileItems.forEach((item, i) => {
                    item.addEventListener("click", (e) => {
                        e.preventDefault();
                        updateNav(i);
                    });
                });

                window.addEventListener("resize", () => {
                    positionDesktopIndicator(getActiveIndex());
                });
            });
        </script>
