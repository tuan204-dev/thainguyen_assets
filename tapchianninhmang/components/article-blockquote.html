<!--
  Component: article-blockquote
  Description: Styled blockquote with left accent border, warm background, and decorative
               opening quotation mark for notable quotes (BBC/Guardian pattern)
  Classes: .article-blockquote
  Usage: Place inside #content (.article-prose) to highlight quotes within article body
-->

<blockquote class="article-blockquote not-prose">
    <style>
        .article-blockquote {
            border-left: 4px solid var(--text-primary-color);
            background: #f8f7f5;
            padding: 20px 24px;
            padding-top: 32px;
            margin: 1.5rem 0;
            font-family: "Noto Serif", serif !important;
            font-style: italic;
            font-size: 1.125rem !important;
            line-height: 1.7;
            color: var(--text-color);
            position: relative;
        }

        .article-blockquote::before {
            content: "\201C";
            position: absolute;
            top: -4px;
            left: 16px;
            font-size: 3.5rem;
            font-family: "Noto Serif", serif;
            font-weight: 700;
            color: var(--text-primary-color);
            opacity: 0.3;
            line-height: 1;
        }

        .article-blockquote cite {
            display: block;
            margin-top: 12px;
            font-style: normal;
            font-size: 0.875rem !important;
            font-weight: 700;
            color: var(--text-color-soft);
            font-family: "Roboto", sans-serif !important;
        }
    </style>
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut
    labore et dolore magna aliqua."
    <cite>— Nguyễn Văn A</cite>
</blockquote>
