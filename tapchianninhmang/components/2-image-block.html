<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Photo Grid - Soundcore C50i</title>
        <style>
            .photo-grid {
                width: 100%;
                max-width: 980px;
                margin: 24px auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
                box-sizing: border-box;
            }

            .photo-grid .photo-row {
                display: flex;
                gap: 12px;
                width: 100%;
            }

            .photo-grid .photo-row .image {
                flex: 1 1 0;
                margin: 0;
                overflow: hidden;
                border-radius: 8px;
                background: #f2f2f2;
            }

            .photo-grid .photo-row .image img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.35s ease;
            }

            .photo-grid .photo-row .image img:hover {
                transform: scale(1.03);
            }

            @media (max-width: 640px) {
                .photo-grid .photo-row {
                    flex-direction: column;
                }
            }
        </style>
    </head>

    <body>
        <div class="photo-grid align-overflow">
            <div class="photo-row">
                <figure class="image">
                    <img
                        src="https://cdnphoto.dantri.com.vn/DJ5eK63hZsQA94oLhiXgFlmNLw4=/thumb_w/980/2026/04/16/anker-soundcore-c50i-theanh-17-1776337089171.jpg?watermark=true"
                        alt="Trải nghiệm tai nghe cho dân thể thao soundcore C50i - 11"
                        width="1920"
                        height="1280"
                        loading="lazy"
                    />
                </figure>
            </div>

            <div class="photo-row">
                <figure class="image">
                    <img
                        src="https://cdnphoto.dantri.com.vn/XCH0UYaTjijQyFkwQXEV_5nSkFw=/thumb_w/980/2026/04/16/anker-soundcore-c50i-theanh-19-1776337087936.jpg?watermark=true"
                        alt="Trải nghiệm tai nghe cho dân thể thao soundcore C50i - 12"
                        width="1920"
                        height="1280"
                        loading="lazy"
                    />
                </figure>
                <figure class="image">
                    <img
                        src="https://cdnphoto.dantri.com.vn/07BoMCM6vFaeeaNKuK8AhUtWYs0=/thumb_w/980/2026/04/16/anker-soundcore-c50i-theanh-18-1776337088964.jpg?watermark=true"
                        alt="Trải nghiệm tai nghe cho dân thể thao soundcore C50i - 13"
                        width="1920"
                        height="1280"
                        loading="lazy"
                    />
                </figure>
            </div>
        </div>
    </body>
</html>
