    <button type="button" id="scrollToTopBtn" aria-label="Lên đầu trang" class="t:max-md:hidden"
        style="position:fixed;right:24px;bottom:24px;width:44px;height:44px;border:none;border-radius:9999px;background:#0A64B4;color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;z-index:120;box-shadow:0 8px 24px rgba(10,100,180,0.35);opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease,background-color .25s ease;">
        ↑
    </button>

    <script>
        (function () {
            const scrollToTopBtn = document.getElementById('scrollToTopBtn');
            if (!scrollToTopBtn) return;

            const toggleVisibility = () => {
                const isVisible = window.scrollY > 280;
                if (isVisible) {
                    if (scrollToTopBtn.style.display !== 'flex') {
                        scrollToTopBtn.style.display = 'flex';
                        requestAnimationFrame(() => {
                            scrollToTopBtn.style.opacity = '1';
                            scrollToTopBtn.style.transform = 'translateY(0)';
                        });
                    }
                } else {
                    scrollToTopBtn.style.opacity = '0';
                    scrollToTopBtn.style.transform = 'translateY(8px)';
                    setTimeout(() => {
                        if (window.scrollY <= 280) {
                            scrollToTopBtn.style.display = 'none';
                        }
                    }, 250);
                }
            };

            window.addEventListener('scroll', toggleVisibility, { passive: true });
            scrollToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            scrollToTopBtn.addEventListener('mouseenter', () => {
                scrollToTopBtn.style.background = '#07528F';
            });

            scrollToTopBtn.addEventListener('mouseleave', () => {
                scrollToTopBtn.style.background = '#0A64B4';
            });

            toggleVisibility();
        })();
    </script>
