<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tạp chí An ninh mạng Việt Nam</title>
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/cate_ghep/desktop/output.css"
        />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/style/fonts-merriweather-vn.css"
        />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/style/fonts-roboto-vn.css"
        />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/style/fonts-noto-serif-vn.css"
        />
        <link rel="stylesheet" href="https://assets.tapchianninhmang.vn/common/style/common.css" />
        <link rel="stylesheet" href="https://assets.tapchianninhmang.vn/common/style/icon.css" />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/vendor/overlayscrollbars.min.css"
        />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/style/overlayscrollbar.css"
        />
        <link rel="stylesheet" href="https://assets.tapchianninhmang.vn/common/style/overlay.css" />
        <link
            rel="stylesheet"
            href="https://assets.tapchianninhmang.vn/common/style/dropdown.css"
        />
    </head>

    <body class="">
        <!-- desktop header -->
        <portlet name="d_header" />

        <!-- mobile header -->
        <portlet name="m_header" />

        <section
            class="cate-featured-section t:bg-linear-to-b t:from-[#E5F3FF] t:to-[#F6FBFF] t:py-5"
        >
            <div class="t:container">
                <!-- portlet: cate_breadcumb -->
                <portlet name="cate_breadcumb" />
                <!-- portlet: cate_featured_tca -->
                <portlet name="cate_featured_tca" />
            </div>
        </section>

        <section class="cate-main-section t:py-5">
            <div class="t:container">
                <div class="cate-grid t:grid t:grid-cols-3">
                    <!-- portlet: cate_article_list -->
                    <portlet name="cate_article_list" />

                    <aside class="cate-sidebar t:pl-4 t:flex t:flex-col t:gap-y-10">
                        <!-- portlet: cate_sidebar -->
                        <portlet name="cate_sidebar" />
                    </aside>
                </div>
            </div>
        </section>

        <portlet name="footer" />

        <script
            type="module"
            src="https://assets.tapchianninhmang.vn/common/overlayscrollbar.js"
        ></script>
        <script
            type="module"
            src="https://assets.tapchianninhmang.vn/common/floating-dropdown.js"
        ></script>
        <script type="module" src="https://assets.tapchianninhmang.vn/common/overlay.js"></script>
        <script
            type="module"
            src="https://assets.tapchianninhmang.vn/common/header-sticky.js"
        ></script>
