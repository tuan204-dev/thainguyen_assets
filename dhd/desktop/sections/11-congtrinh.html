<!-- ====== SECTION: CÁC CÔNG TRÌNH, DỰ ÁN CHÀO MỪNG ĐẠI HỘI ====== -->
<section class="ct-section t:relative t:overflow-hidden t:bg-[#fff9f2] t:py-8 t:pc:py-10">
    <!-- decorative watermark -->
    <img
        src="./images/ct-bg-watermark.png"
        alt=""
        aria-hidden="true"
        class="t:pointer-events-none t:select-none t:absolute t:left-1/2 t:top-0 t:-translate-x-1/2 t:h-full t:w-auto t:max-w-none t:opacity-100"
        loading="lazy"
    />

    <div class="t:container t:relative">
        <!-- Title -->
        <h2
            class="t:text-center t:text-xl t:pc:text-[1.75rem] t:font-semibold t:uppercase t:leading-tight t:text-[#2d2d2d] t:mb-6 t:pc:mb-8"
        >
            Các công trình, dự án chào mừng Đại hội
        </h2>

        <!-- Slider -->
        <div
            class="ct-swiper swiper t:relative t:w-full t:px-10 t:pc:px-12"
            data-swiper
            data-swiper-slides-per-view="1"
            data-swiper-space-between="20"
            data-swiper-breakpoints='{"640":{"slidesPerView":2},"1000":{"slidesPerView":3},"1280":{"slidesPerView":4}}'
        >
            <div class="swiper-wrapper">
                <!-- slide 1 -->
                <div class="swiper-slide t:h-auto">
                    <a href="#" class="ct-card t:block t:group">
                        <figure class="img-block t:w-full t:rounded-lg">
                            <img
                                src="./images/ct-cum-cong-nghiep-hanh-phuc.png"
                                alt="Cụm công nghiệp Hạnh Phúc - Xuân Phương"
                                loading="lazy"
                            />
                            <figcaption
                                class="t:absolute t:inset-x-0 t:bottom-0 t:px-3 t:pt-10 t:pb-2.5 t:bg-gradient-to-t t:from-[#e11718] t:to-transparent t:text-white t:text-lg t:font-medium t:leading-snug"
                            >
                                Cụm công nghiệp Hạnh Phúc - Xuân Phương
                            </figcaption>
                        </figure>
                    </a>
                </div>
                <!-- slide 2 -->
                <div class="swiper-slide t:h-auto">
                    <a href="#" class="ct-card t:block t:group">
                        <figure class="img-block t:w-full t:rounded-lg">
                            <img
                                src="./images/ct-khu-du-lich-ho-nui-coc.png"
                                alt="Khu du lịch nghỉ dưỡng quốc tế 5 sao hồ Núi Cốc"
                                loading="lazy"
                            />
                            <figcaption
                                class="t:absolute t:inset-x-0 t:bottom-0 t:px-3 t:pt-10 t:pb-2.5 t:bg-gradient-to-t t:from-[#e11718] t:to-transparent t:text-white t:text-lg t:font-medium t:leading-snug"
                            >
                                Khu du lịch nghỉ dưỡng quốc tế 5 sao hồ Núi Cốc
                            </figcaption>
                        </figure>
                    </a>
                </div>
                <!-- slide 3 -->
                <div class="swiper-slide t:h-auto">
                    <a href="#" class="ct-card t:block t:group">
                        <figure class="img-block t:w-full t:rounded-lg">
                            <img
                                src="./images/ct-nha-may-tam-lat-san-pvc.png"
                                alt="Nhà máy sản xuất tấm lát sàn PVC"
                                loading="lazy"
                            />
                            <figcaption
                                class="t:absolute t:inset-x-0 t:bottom-0 t:px-3 t:pt-10 t:pb-2.5 t:bg-gradient-to-t t:from-[#e11718] t:to-transparent t:text-white t:text-lg t:font-medium t:leading-snug"
                            >
                                Nhà máy sản xuất tấm lát sàn PVC
                            </figcaption>
                        </figure>
                    </a>
                </div>
                <!-- slide 4 -->
                <div class="swiper-slide t:h-auto">
                    <a href="#" class="ct-card t:block t:group">
                        <figure class="img-block t:w-full t:rounded-lg">
                            <img
                                src="./images/ct-san-gon-glory-ho-suoi-lanh.png"
                                alt="Sân gôn Glory tại khu vực hồ Suối Lạnh, xã Thành Công"
                                loading="lazy"
                            />
                            <figcaption
                                class="t:absolute t:inset-x-0 t:bottom-0 t:px-3 t:pt-10 t:pb-2.5 t:bg-gradient-to-t t:from-[#e11718] t:to-transparent t:text-white t:text-lg t:font-medium t:leading-snug"
                            >
                                Sân gôn Glory tại khu vực hồ Suối Lạnh, xã Thành Công
                            </figcaption>
                        </figure>
                    </a>
                </div>
            </div>

            <!-- prev / next: red circular chevrons on both sides -->
            <button
                type="button"
                class="ct-nav ct-nav--prev swiper-button-prev"
                aria-label="Slide trước"
            >
                <i class="material-symbols--arrow-back-ios-rounded"></i>
            </button>
            <button
                type="button"
                class="ct-nav ct-nav--next swiper-button-next"
                aria-label="Slide sau"
            >
                <i class="material-symbols--arrow-forward-ios-rounded"></i>
            </button>
        </div>
    </div>
</section>
